site_name: stuff overlay
site_description: Local AI, GPU compute, and hard-to-package software on Gentoo — guides for the istitov/stuff overlay
site_url: https://istitov.github.io/stuff/
repo_url: https://github.com/istitov/stuff
repo_name: istitov/stuff
edit_uri: edit/docs/docs/
copyright: Drafted with AI assistance; package claims are checked against the ebuilds and dated where volatile.

theme:
  name: material
  logo: assets/logo.png
  favicon: assets/favicon.png
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: deep purple
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: deep purple
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - content.code.copy
    - navigation.sections

docs_dir: docs

nav:
  - Home: index.md
  - Setup: setup.md
  - AI stack: ai-stack.md
  - Guides:
      - Check GPU hardware: guides/hardware-targets.md
      - Ryzen AI NPU: guides/ryzen-ai-npu.md
      - vLLM: guides/vllm.md
      - llama.cpp, Ollama & llama-swap: guides/llama-setup.md
      - Fine-tuning, Unsloth & RAG: guides/fine-tuning-rag.md
      - ComfyUI + TRELLIS: guides/comfyui.md
      - Qt5 LTS: guides/qt5-lts.md
      - TeX Live: guides/texlive.md
  - Benchmarks:
      - Overview: benchmarks/index.md
      - Speculative decoding on Radeon 890M: benchmarks/speculative-decoding-on-890M.md

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.details
