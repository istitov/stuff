# Inherits from ::gentoo: manifest-hashes, eapis-banned,
# cache-formats, properties-allowed, restrict-allowed.
masters = gentoo
# Manifests carry only DIST entries, no per-file checksums for
# in-tree files.
thin-manifests = true
# Commit signing is not enforced through this flag. Work lands as
# unsigned commits on a working branch; the maintainer signs at push
# time with their own key, which is what the published history is
# verified against. verified 2026-07-26
sign-commits = false
