[DEFAULT]
# Suppressions applied repo-wide. pkgcheck only honors [DEFAULT],
# [CHECKSETS], and repo-alias sections; per-package suppression via
# [category/pkg] is not supported, so every entry here is global.
# Re-run the suppressed classes with `pkgcheck scan -k <keywords>` (and
# `-c RedundantVersionCheck`) on each audit; members not named below
# are new and need a reason or a fix.
#
# RedundantVersionCheck:
#   Retention policy ("last three releases plus the last of each earlier
#   major series") keeps older versions on purpose for rollback. pkgcheck
#   cannot tell deliberate retention from forgotten cruft, so the whole
#   check fires on packages we want to keep; bin/retention-audit.py
#   applies the actual policy instead. Re-run 2026-10-03: 665 findings
#   across 308 packages.
#
# NonsolvableDepsIn{Dev,Exp}:
#   Niche profiles routinely lack keywords on upstream sci-python deps.
#   Re-run 2026-10-03: Dev 267 findings over 81 packages, Exp 292 over
#   88, all on amd64 musl/x32/hardened variants, arm64 hardened and
#   big-endian, arm, x86 i486 and hurd. The arm64 share comes from ~arm64
#   keywords on packages whose dependencies lack arm64 in ::gentoo.
#   Verified concretely on 2026-04-23, when a re-enabled run
#   surfaced 45 findings, split 26/x32 + 19/musl.
#   The x32 cluster is driven by dev-python/ipywidgets, jupyterlab,
#   jupyter-server-proxy and plotly not being ~amd64-keyworded on
#   the x32 sub-profile - hitting pyxem, abtem, ipympl,
#   hyperspy-gui-ipywidgets, dask-labextension, sasmodels, bumps.
#   The musl cluster is driven by dev-util/nvidia-cuda-toolkit,
#   dev-libs/cusparselt, dev-util/ruff, dev-python/sphinxcontrib-bibtex,
#   hatch-* and sci-physics/ifeffit - hitting cupy,
#   mumax, prismatic, matplotlib-scalebar, colorspacious, sasview,
#   demeter. All are legitimate ~amd64 claims against sub-profiles
#   with narrower dep coverage; fixing would mean per-package
#   profile-specific masks for archs nobody using this overlay
#   consumes. Not actionable from this overlay.
#
# NonsolvableDepsInStable:
#   Same shape as the {Dev,Exp} suppression above, just on the
#   mainline stable profiles. We are a ~amd64-first overlay that
#   ships testing-keyworded ebuilds with version-pinned chains
#   (vllm/pytorch, cuda-bindings/cuda-pathfinder, qtdatavis3d/
#   qtbase). None of those chains have stable counterparts
#   in either this overlay or ::gentoo, so the stable-profile dep
#   tree is unsolvable by construction; users on strictly-stable
#   systems wouldn't have ~amd64 enabled to install our packages
#   in the first place. Verified 2026-05-09: after narrowing
#   dev-python/pyside-6.11.1-r99 to ~amd64-only and dropping ~x86
#   from pyvista/pyvistaqt (real cleanups, committed separately), the
#   residual ~32 findings are all chain-of-testing-deps cases.
#   Re-run 2026-10-03: 146 findings over 47 packages, 120 of them on
#   arm64, 11 arm, 7 x86 and 8 amd64.
#   The suppression also hid real install failures on amd64 itself, so
#   scripts/pkgcheck/amd64-solvable.py runs this check on the stable amd64
#   profiles only, locally and in CI, and fails on any finding not listed,
#   with its reason, in amd64-solvable.expected beside it.
#   verified 2026-10-03
#
# UnderscoreInUseFlag, PythonMismatchedPackageName, RequiredUseDefaults:
#   Three check classes that fire on intentional packaging shapes.
#   Members re-listed 2026-10-03 against the unsuppressed scan
#   (11, 21 and 23 findings).
#
#   * py2 forks (8 of UnderscoreInUseFlag, 4 of PythonMismatchedPackageName,
#     8 of RequiredUseDefaults): the locally-vendored *_py2 eclasses and
#     the dev-python/*-python2 packages, pygtk, pygobject 2.x and
#     unittest-or-fail keep python_targets_python2_7 in IUSE and do not
#     rename to match their py3 upstreams; they are py2-only forks kept
#     after ::gentoo dropped py2 support.
#   * USE_EXPAND names (3 of UnderscoreInUseFlag): dev-util/hip's
#     video_cards_amdgpu / video_cards_nvidia and media-libs/opencv's
#     video_cards_intel get their underscore from Gentoo's USE_EXPAND
#     naming, not from us; not actionable.
#   * `-bin` packages (15 of PythonMismatchedPackageName): amd-quark-bin,
#     comfy-aimdo-bin, comfy-angle-bin, comfy-kitchen-bin, cuda-tile-bin,
#     instanttensor-bin, kornia-rs-bin, pymupdf-layout-bin,
#     pynvvideocodec-bin, runai-model-streamer-bin, simpleitk-bin,
#     sqlite-vec-bin, tokenspeed-mla-bin, tokenspeed-triton-bin and
#     triton-bin install upstream's binary wheels; the suffix tells them
#     apart from source builds, and the PyPI name is the suffix-less form.
#   * comfyui-workflow-templates-media-assets01 and -02 (2 of
#     PythonMismatchedPackageName): PyPI's normalised names end in -01
#     and -02, and PMS forbids a package name that ends in a hyphen
#     followed by something matching the version syntax, so the hyphen
#     is dropped. The other mixed-case and python- names were renamed
#     on 2026-10-03 (profiles/updates/4Q-2026).
#   * A choice the user has to make (RequiredUseDefaults): tilelang needs
#     exactly one of cuda and rocm, therock-bin exactly one GPU target,
#     and amd-quark-bin (cp312/cp313 wheels), dask-labextension (matches
#     jupyter-server-proxy) and google-ai-generativelanguage-0.6.15 with
#     google-generativeai (protobuf <6 has no python3_14 in ::gentoo)
#     lack the default Python target.
#   * Profile flag interactions (RequiredUseDefaults): dev-python/silx's
#     opencl against the desktop profile, which disables it. pyqt5 and
#     opencv-5.0.0-r90 failed the desktop profiles too until 2026-10-03.
#
# DeprecatedDep is intentionally left enabled, but most of what it now
# reports is not actionable. Re-triaged 2026-10-03 (43 findings):
#
#   Real pending migrations, worth surfacing:
#     sci-visualization/gwyddion   x11-libs/gtksourceview:2.0 (GTK2)
#     sci-physics/mantid           dev-python/versioningit
#     x11-libs/gtk+                x11-themes/gtk-engines-adwaita
#     dev-python/pygtk             gnome-base/libglade
#       (a deprecated GNOME 2 package; pygtk is a py2 fork, so migrating
#        is not straightforward)
#
#   Not actionable -- upstream requires the deprecated package, so the
#   dep cannot be dropped from our side:
#     dev-python/httpx   (deprecated 2026-04-01, upstream stopped taking
#       bug reports) pulled in by anthropic, httpx-sse, mcp,
#       model-hosting-container-standards, openai, tavily-python, weasel,
#       sci-ml/amd-gaia, sci-ml/huggingface_hub, sci-ml/datasets and
#       sci-ml/diffusers (both httpx<1), and sci-ml/unsloth[studio]
#       (upstream's studio extra)
#     dev-python/orjson  (deprecated over unsafe Rust) pulled in by
#       dev-python/mp-api and dev-python/pymatgen-core, both of which
#       declare "orjson<4,>=3.10" with no extra marker
#
# No longer firing since the 2026-07-27 triage: manpageeditor moved to
# gtksourceview:3.0, sofastatistics to psycopg 3, and pygtk no longer
# pulls dev-libs/atk.
#
# MatchingChksums:
#   Byte-identical distfiles under different names, all intentional.
#   Re-listed 2026-10-07 (8 findings).
#   (1) mail-client/tutanota-desktop-bin ships tutao-pub.pem with
#   each release; upstream's signing key carries across versions, so
#   the PEM is identical from release to release by design.
#   (2) dev-util/codex: the vendored crate tarball did not change
#   between 0.160.0 and 0.160.1, and rusty_v8's generated binding is
#   the same file for x86_64 and aarch64.
#   (3) sci-ml/ollama: the vendored Go module tarball did not change
#   across 0.34.4, 0.35.0 and 0.35.1.
#   (4) sci-libs/onnxruntime's cutlass-4.4.2.tar.gz and dev-python/vllm's
#   vllm-cutlass-4.4.2.gh.tar.gz are the same CUTLASS release under two
#   distfile names. Sharing onnxruntime's name trips PythonGHDistfileSuffix,
#   since the Python guide wants GitHub archives in dev-python to end in
#   .gh.tar.gz, so the double download stays.
#
# DuplicateFiles:
#   dev-python/vllm names each flash-attn patch after the commit the ebuild
#   pins, because the filename is composed from ${VLLM_FA_COMMIT:0:7}. The
#   name is therefore a record of which upstream revision the patch was
#   validated against, not decoration. When a vllm bump moves the pin and the
#   patch still applies unchanged, the result is a byte-identical file under
#   the new commit's name -- currently 06bdd47 and 506341a, for both the
#   fa3-only-when-archs and py314 patches (re-checked 2026-10-03).
#   Deduplicating by pointing the newer ebuild at the older commit's files
#   would break that mapping, and a later pin bump whose patch does NOT apply
#   cleanly would then look exactly like one that does. Same reasoning as the
#   MatchingChksums note above. The duplication is self-limiting: it clears
#   when the older vllm versions drop under retention.
#   Verified 2026-07-27.
#
# UnknownRestrict:
#   pkgcheck only knows the PMS-blessed RESTRICT values (bindist,
#   fetch, mirror, primaryuri, splitdebug, strip, test, userpriv).
#   `network-sandbox` is a Portage extension that disables Portage's
#   network sandbox so the build can fetch at compile-time. It is
#   honored correctly at portage-time; pkgcheck just doesn't have it
#   in its allow-list. Re-run 2026-10-03: 38 ebuilds across 15
#   packages, in four shapes:
#   (1) cmake/CPM FetchContent at configure time —
#   dev-python/nvidia-cudnn-frontend (sub-deps), dev-python/{librmm,
#   rmm} (RAPIDS CPM pulls rapids-cmake/CCCL/fmt), sci-ml/fastflowlm +
#   sci-ml/lemonade (cpp-httplib/libwebsockets and tokenizers-cpp
#   sub-cargo), sci-libs/aotriton (Triton's wheel build downloads its
#   backend and LLVM; AOTriton fetches aiter).
#   (2) cargo crate fetch — dev-util/zluda (live), sci-ml/kokoros
#   (live), app-misc/qdrant (git-forked deps absent from crates.io).
#   (3) web-UI assets fetched at configure time —
#   sci-misc/llama-cpp[webui], sci-misc/llama-swap[ui], www-apps/hollama,
#   sci-ml/unsloth[studio] and sci-ml/unsloth-desktop (npm installs).
#   (4) live-only fetches — dev-libs/xrt-xdna-999999.
#   The convention is that live ebuilds keep this bypass
#   while tagged releases should pre-vendor via the cargo eclass; the
#   tagged fastflowlm/lemonade versions still need vendoring (open
#   follow-up). Suppressing the warning until the tagged ones are
#   vendored AND pkgcheck learns network-sandbox.

checks = -RedundantVersionCheck
keywords = -DuplicateFiles,-NonsolvableDepsInDev,-NonsolvableDepsInExp,-NonsolvableDepsInStable,-UnderscoreInUseFlag,-PythonMismatchedPackageName,-RequiredUseDefaults,-UnknownRestrict,-MatchingChksums
